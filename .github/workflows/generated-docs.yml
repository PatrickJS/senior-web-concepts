name: Generated docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-docs:
    name: Verify generated docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: find scripts src examples -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Generate docs
        run: npm run generate

      - name: List topics
        run: npm run list

      - name: Run representative examples
        run: |
          npm run example:capacity
          npm run example:vector-search
          npm run example:query-cost
          npm run example:rollout
          npm run example:cidr

      - name: Verify docs are committed
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::Generated docs are out of date. Run npm run generate and commit the docs/ changes."
            exit 1
          fi
